; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = partitions_16MB.csv

upload_speed = 921600
monitor_speed = 115200

monitor_filters = 
    time                    ; Thêm timestamp vào log
    esp32_exception_decoder ; Tự động dịch mã lỗi (Backtrace) ra dòng code bị crash (Core dump)
    colorize                ; Bôi màu log theo level (E, W, I, D, V)

build_flags =
    -D CORE_DEBUG_LEVEL = 3
    -D BOARD_HAS_PRAM