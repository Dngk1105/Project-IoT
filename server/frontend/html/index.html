<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUST IoT Assistant - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Load thư viện MQTT.js qua CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>HUST IoT Assistant - MQTT Dashboard</h1>
        
        <div class="status-panel">
            <div class="status-item">
                <h3>Trạng thái Web UI (Broker)</h3>
                <span id="ui-status" class="status connecting">Đang kết nối...</span>
            </div>
            <div class="status-item">
                <h3>Trạng thái ESP32</h3>
                <span id="esp-status" class="status offline">Không rõ</span>
            </div>
        </div>

        <div class="main-content">
            <div class="panel console-panel">
                <h2>Console Log (Real-time)</h2>
                <div class="controls">
                    <button id="clear-btn">Xóa Log</button>
                </div>
                <div id="console-log" class="console"></div>
            </div>

            <div class="panel publish-panel">
                <h2>Test Publish</h2>
                <form id="publish-form">
                    <div class="form-group">
                        <label for="pub-topic">Topic:</label>
                        <input type="text" id="pub-topic" placeholder="Ví dụ: hust_iot/test" required>
                    </div>
                    <div class="form-group">
                        <label for="pub-payload">Payload:</label>
                        <textarea id="pub-payload" rows="4" placeholder="Nhập nội dung tin nhắn..." required></textarea>
                    </div>
                    <button type="submit" id="pub-btn">Publish</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/mqtt_ws.js"></script>
</body>
</html>
