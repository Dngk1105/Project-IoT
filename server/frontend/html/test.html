<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MQTT Debug Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; height: 100vh; margin: 0; background: #1e1e1e; color: #fff; }
        .panel { padding: 20px; box-sizing: border-box; }
        .left-panel { width: 35%; background: #2d2d2d; border-right: 1px solid #444; }
        .right-panel { width: 65%; display: flex; flex-direction: column; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        input, textarea { width: 100%; padding: 8px; background: #1e1e1e; border: 1px solid #555; color: #fff; box-sizing: border-box; font-family: monospace; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #45a049; }
        #log-window { flex-grow: 1; background: #000; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; line-height: 1.5; }
        .log-time { color: #888; }
        .log-topic { color: #569CD6; font-weight: bold; }
        .log-payload { color: #CE9178; }
        .btn-audio { background: #9C27B0; }
        .log-in { border-left: 3px solid #4CAF50; padding-left: 10px; margin-bottom: 8px; }
        .log-out { border-left: 3px solid #FF9800; padding-left: 10px; margin-bottom: 8px; }
    </style>
    <!-- Kéo thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div class="panel left-panel">
        <h2>Công cụ Gửi lệnh (Publish)</h2>
        <div class="form-group">
            <label>Broker WS URL:</label>
            <input type="text" id="brokerUrl" value="ws://localhost:9001">
        </div>
        <button id="btnConnect" style="margin-bottom: 20px;">Kết nối Broker</button>

        <button id="btnInitAudio" class="btn-audio" style="margin-bottom: 20px;"> Cấp quyền Bật Loa</button>
        <button id="btnSendBeep" style="background: #2196F3; margin-bottom: 20px;">Test Loa ESP32 (Gửi tiếng Bíp)</button>

        <div class="form-group">
            <label>Topic:</label>
            <input type="text" id="pubTopic" value="device/esp32_123456/commands/alarm/snooze">
        </div>
        <div class="form-group">
            <label>Payload (JSON):</label>
            <textarea id="pubPayload" rows="5">{"action":"snooze", "duration": 300}</textarea>
        </div>
        <button id="btnPublish" style="background: #FF9800;">Gửi Gói Tin</button>
        <button id="btnClear" style="background: #d32f2f; margin-top: 10px;">Xóa Log</button>
    </div>

    <div class="panel right-panel">
        <h2>Terminal: Nhận gói tin (Subscribe: #)</h2>
        <div id="log-window"></div>
    </div>

    <!-- Gắn script logic -->
    <script src="../js/test_mqtt_ws.js"></script>
</body>
</html>
